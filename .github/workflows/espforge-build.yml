name: ESPForge firmware build
run-name: ESPForge build ${{ inputs.espforge_build_uuid || github.event.client_payload.espforge_build_uuid }}

"on":
  workflow_dispatch:
    inputs:
      espforge_build_uuid:
        description: Unique ESPForge build identifier
        required: true
        type: string
  repository_dispatch:
    types: [espforge_build]

permissions:
  contents: read

concurrency:
  group: espforge-${{ inputs.espforge_build_uuid || github.event.client_payload.espforge_build_uuid }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
          submodules: recursive
      - name: Apply selected ESP-IDF hardware configuration
        env:
          ESPFORGE_SDKCONFIG: "Y29uZmlncy9zZGtjb25maWcuQ1lERHVhbFVTQg=="
        run: |
          python - <<'PY'
          import base64, os, pathlib, shutil
          source = pathlib.Path(base64.b64decode(os.environ["ESPFORGE_SDKCONFIG"]).decode())
          if not source.is_file():
              raise SystemExit(f"Selected sdkconfig file does not exist: {source}")
          destination = pathlib.Path("sdkconfig")
          if source.resolve() != destination.resolve():
              shutil.copyfile(source, destination)
          PY
      - uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          esp_idf_version: v5.5.1
          target: esp32
          path: "."
      - name: Collect binaries
        run: |
          mkdir -p firmware-output
          find build -maxdepth 2 -type f -name "*.bin" -exec cp --parents {} firmware-output/ \;
      - name: Name firmware files for selected hardware
        env:
          ESPFORGE_ARTIFACT_PREFIX: "CYDDualUSB"
        run: |
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path("firmware-output")
          prefix = os.environ["ESPFORGE_ARTIFACT_PREFIX"]
          def role(path):
              name = path.name.lower()
              if "bootloader" in name: return "bootloader", ".bin"
              if "partition" in name: return "partitions", ".bin"
              if "merged" in name or "merged-flash" in name: return "merged", ".bin"
              if any(item in name for item in ("littlefs", "spiffs", "fatfs", "filesystem")): return "filesystem", ".bin"
              if name.endswith(".elf"): return "application", ".elf"
              if name.endswith(".map"): return "application", ".map"
              if name == "firmware.bin" or name.endswith(".ino.bin"): return "application", ".bin"
              label = re.sub(r"[^a-z0-9_.-]+", "-", path.stem).strip(".-") or "firmware"
              return label, path.suffix or ".bin"
          for path in [item for item in root.rglob("*") if item.is_file()]:
              label, extension = role(path)
              filename = f"{prefix}-{label}{extension}"
              destination, counter = root / filename, 2
              while destination.exists() and destination != path:
                  destination = root / f"{prefix}-{label}-{counter}{extension}"
                  counter += 1
              if destination != path:
                  path.replace(destination)
          for directory in sorted([item for item in root.rglob("*") if item.is_dir()], reverse=True):
              try: directory.rmdir()
              except OSError: pass
          PY
      - name: Generate ESPForge flashing manifest
        env:
          ESPFORGE_FRAMEWORK: "esp-idf"
          ESPFORGE_CHIP: "esp32"
          ESPFORGE_CONFIG_DIGEST: "cb6bf60087e197261c51aea6dc6aab8e471b511a0de1ea85509d5119fe0dc039"
          ESPFORGE_ANALYZER_VERSION: "targets-v6"
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("firmware-output")
          offsets = {}
          # Consume only offsets emitted authoritatively by PlatformIO/ESP-IDF.
          # Never guess an address from a filename or board family.
          for candidate in list(pathlib.Path('.').glob('**/flasher_args.json')):
              try:
                  payload = json.loads(candidate.read_text())
                  for address, filename in payload.get('flash_files', {}).items(): offsets[pathlib.Path(filename).name] = int(address, 0)
              except (OSError, ValueError, TypeError, json.JSONDecodeError): pass
          for candidate in list(pathlib.Path('.').glob('**/flash_args')) + list(pathlib.Path('.').glob('**/flash_project_args')):
              try:
                  tokens = candidate.read_text().split()
                  for index, token in enumerate(tokens[:-1]):
                      if token.startswith('0x') and tokens[index + 1].lower().endswith('.bin'): offsets[pathlib.Path(tokens[index + 1]).name] = int(token, 16)
              except (OSError, ValueError): pass
          files = []
          for path in sorted(root.rglob("*.bin")):
              data = path.read_bytes()
              files.append({
                  "path": path.relative_to(root).as_posix(),
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "offset": offsets.get(path.name)
              })
          manifest = {
              "schema": "https://espforge.dev/schemas/flash-manifest-v1.json",
              "version": 1,
              "chip": os.environ["ESPFORGE_CHIP"],
              "framework": os.environ["ESPFORGE_FRAMEWORK"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "configuration_sha256": os.environ["ESPFORGE_CONFIG_DIGEST"] or None,
              "analyzer_version": os.environ["ESPFORGE_ANALYZER_VERSION"] or None,
              "files": files,
              "warning": "Offsets are included only when emitted by the project toolchain. Manually verify any file whose offset is null."
          }
          root.mkdir(parents=True, exist_ok=True)
          (root / "espforge-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: espforge-firmware
          path: firmware-output/
          if-no-files-found: error